[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mmla-rsi"
version = "0.2.0"
description = "Bounded recursive adaptation through RTT and RTMA"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MMLA contributors"}]
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "safetensors>=0.5"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
examples = ["transformers>=4.51,<6"]
orbit = ["torch==2.11.0+cu128", "transformers==5.12.1", "safetensors==0.8.0", "numpy==2.3.5", "tokenizers==0.22.2", "huggingface_hub==1.33.0"]

[project.urls]
Repository = "https://github.com/MMLA-org/MMLA-RSI"
Issues = "https://github.com/MMLA-org/MMLA-RSI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mmla_orbit._runtime" = ["runtime-manifest.json"]
