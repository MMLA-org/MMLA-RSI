name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[examples]'
      - run: python -m unittest discover -s tests -v
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          HF_HUB_OFFLINE: '1'
      - run: python examples/rules_and_memory.py
      - run: python examples/tiny_recursion.py --mode joint --output runs/ci-joint
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_OFFLINE: '1'
